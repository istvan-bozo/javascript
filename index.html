<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite IBM PCs</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/javaFunctions.js"></script>
</head>

<body onload = "addTabFocus()">
    <header>
        <div>
            <h1>IBM Personal Computers</h1>
        </div>
    </header>
    <main id="main_ibm">
        <p id="compu_text">The PS/1 (known in some European countries as the PS/1000) is a brand for a line of personal computers that marked IBM's return to the home market in 1990</p>
        <div id="picture_div" class="flex" style="background-image: url('');">
            Hover over or tab to an image below to display it here.
        </div>
        <div id="ibm_div" class="flex">
            <img src="images/ibm_ps2_70.jpg" alt="IBM PS/2 complete computer" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
            <img src="images/ibm_aptiva_multimedia.jpg" alt="IBM Aptiva tower computer" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
            <img src="images/ibm_personal_computer_330_1.jpg" alt="Cover of an IBM brochure" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
            <img src="images/ibm_ps1_m2011_1.jpg" alt="IBM PS/1 all in one computer" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
            <img src="images/ibm_ps1_imagination_system_large.jpg" alt="IBM advertising page from a newspaper" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
            <img src="images/ibm_valuepoint.jpg" alt="A close-up of an IBM Valuepoint 486 computer" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
            <img src="images/ibm_486.jpg" alt="IBM Valupoint complete computer with mouse, keyboard and monitor" width="100" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
          </div>
    </main>
    <footer>
        <p>© Bozó István</p>
            <a href="#top" class="back">Back to top</a>
    </footer>
</body>
</html>
